<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Preview: bancada dos assets</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #111; color: #ddd; }
  #frame { width: 1280px; height: 720px; border: 0; display: block; }
  #log { padding: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<iframe id="frame"></iframe>
<div id="log"></div>
<script>
// Simula o lado do Studio: abre o runtime Web num iframe, chama a ponte e mede
// o tempo até o quadro com o resultado ser desenhado (o runtime avisa por onEvent).
(() => {
  let req = 0;
  const waiting = new Map();
  let readyResolve = null;
  const log = (s) => { document.getElementById('log').textContent += s + '\n'; console.log(s); };

  window.vnPreviewHost = {
    onEvent(kind, text) {
      const info = JSON.parse(text);
      if (kind === 'ready' && readyResolve) { readyResolve(info); readyResolve = null; }
      else if ((kind === 'done' || kind === 'error') && waiting.has(info.req)) {
        const w = waiting.get(info.req); waiting.delete(info.req);
        info.total_ms = performance.now() - w.t0;
        (kind === 'done' ? w.resolve : w.reject)(info);
      }
    }
  };

  const frame = document.getElementById('frame');
  const api = () => frame.contentWindow.vnPreview;

  window.bench = {
    log,
    // Abre (ou reabre) o runtime e espera o primeiro quadro desenhado.
    async open(src) {
      const t0 = performance.now();
      const ready = new Promise(r => { readyResolve = r; });
      frame.src = src + (src.includes('?') ? '&' : '?') + 'n=' + Math.random();
      const info = await Promise.race([ready, new Promise((_, rej) => setTimeout(() => rej(new Error('o runtime não abriu: ' + src)), 60000))]);
      return { ms: performance.now() - t0, godot: info.godot };
    },
    // Chama um método da ponte e espera o "done" do quadro desenhado.
    call(method, ...args) {
      const id = ++req;
      return new Promise((resolve, reject) => {
        waiting.set(id, { t0: performance.now(), resolve, reject });
        setTimeout(() => { if (waiting.delete(id)) reject(new Error('sem resposta: ' + method)); }, 60000);
        // caminhos relativos viram URLs absolutas: o HTTPRequest do Godot não resolve caminhos relativos
        api()[method](id, ...args.map(a => (typeof a === 'string' && a.startsWith('/build/')) ? location.origin + a : a));
      });
    },
  };
})();
</script>
<script src="assets.js"></script>
<script>
// Com ?autorun=1&engine=<nome>, roda o teste B e grava build/work/results-<nome>.json.
(() => {
  const q = new URLSearchParams(location.search);
  if (!q.get('autorun')) return;
  window.addEventListener('load', async () => {
    const engine = q.get('engine') || 'desconhecido';
    let out;
    try {
      out = await runAssets({ engine, swaps: Number(q.get('edits') || 20), maxImages: Number(q.get('images') || 0) });
    } catch (e) {
      out = { engine, error: String(e && e.stack || e) };
    }
    await fetch(`/write/results-${engine}.json`, { method: 'PUT', body: JSON.stringify(out, null, 2) });
  });
})();
</script>
</body>
</html>
