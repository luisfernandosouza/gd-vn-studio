<!DOCTYPE html>
<!-- Página do painel do Preview (spike M4-02): o export Web do runtime, servido por vnpreview://.
     Faz a ponte do PP §1.1 (vnPreview.send / vnPreview.onmessage) e a repassa à página do Studio,
     que a abre num iframe, por postMessage. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<title>$GODOT_PROJECT_NAME</title>
<style>
html, body, #canvas { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
#canvas:focus { outline: none; }
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas">O navegador não tem suporte a canvas.</canvas>
<script src="$GODOT_URL"></script>
<script>
(function () {
	const t0 = performance.now();
	const toStudio = (msg) => window.parent.postMessage(msg, '*');
	const queue = [];
	// O Studio registra onmessage antes de iniciar o motor (PP §1.1, item 2).
	window.vnPreview = {
		onmessage(text) { toStudio({ vn: 'from-runtime', text, t: performance.now() - t0 }); },
	};
	window.addEventListener('message', (ev) => {
		if (ev.source !== window.parent || !ev.data || ev.data.vn !== 'to-runtime') return;
		if (typeof window.vnPreview.send === 'function') window.vnPreview.send(ev.data.text);
		else queue.push(ev.data.text);
	});
	const flush = setInterval(() => {
		if (typeof window.vnPreview.send !== 'function') return;
		clearInterval(flush);
		while (queue.length) window.vnPreview.send(queue.shift());
	}, 5);
	if (new URLSearchParams(location.search).has('checks')) {
		// Conferências do protocolo, sem abrir o motor: Content-Type do .wasm e compilação em
		// streaming (que só funciona com application/wasm, PP §1.1).
		const wasm = new URL('index.wasm', location.href).href;
		(async () => {
			const out = { secure_context: window.isSecureContext, origin: location.origin };
			try {
				const r = await fetch(wasm, { method: 'HEAD' });
				out.head_status = r.status;
				out.wasm_content_type = r.headers.get('content-type');
			} catch (e) { out.head_error = String(e); }
			const t = performance.now();
			try {
				await WebAssembly.compileStreaming(fetch(wasm));
				out.compile_streaming = true;
			} catch (e) { out.compile_streaming = false; out.compile_streaming_error = String(e); }
			out.compile_streaming_ms = performance.now() - t;
			toStudio({ vn: 'checks', result: out });
		})();
		return;
	}
	const engine = new Engine($GODOT_CONFIG);
	engine.startGame().then(
		() => toStudio({ vn: 'started', t: performance.now() - t0, secure: window.isSecureContext }),
		(err) => toStudio({ vn: 'error', text: String(err), t: performance.now() - t0 }),
	);
})();
</script>
</body>
</html>
