# Audio Manager do runtime (tarefa M2-05; RT §5.2, §5.5; Req §12; UI Spec §8).
# Testa canais, volumes das configurações, legendas e modo stream contra os dublês
# (M0-07), as fixtures dialogue e stream (M0-08) e os vetores de modo stream da spec 08.
name: Runtime audio

on:
  pull_request:
    paths: [runtime/vn_runtime/audio/**, runtime/vn_runtime/core/**, runtime/tests/audio/**, runtime/tests/fakes/**, runtime/tests/fixtures/**, docs/specs/conformance/flow.json, .github/workflows/runtime-audio.yml]
  push:
    branches: [main]
    paths: [runtime/vn_runtime/audio/**, runtime/vn_runtime/core/**, runtime/tests/audio/**, runtime/tests/fakes/**, runtime/tests/fixtures/**, docs/specs/conformance/flow.json, .github/workflows/runtime-audio.yml]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  audio:
    runs-on: [self-hosted, linux, vn-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -q 'jsonschema>=4.18'
      - name: Gera as fixtures (sons sintéticos)
        run: python runtime/tests/fixtures/generate.py
      - name: Cache do Godot ${{ env.GODOT_VERSION }}
        id: cache-godot
        uses: actions/cache@v5
        with:
          path: ~/.cache/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64
      - name: Baixa o Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot.zip" "$url"
          mkdir -p ~/.cache/godot-bin
          unzip -q "$RUNNER_TEMP/godot.zip" -d ~/.cache/godot-bin
      - name: Instala o Godot
        run: |
          set -euo pipefail
          install -m 755 ~/.cache/godot-bin/"Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          godot --headless --version
      - name: Importa o projeto
        run: godot --headless --path runtime --import 2>&1 | tee "$RUNNER_TEMP/import.log"
      - name: Testes do Audio Manager
        run: |
          set -euo pipefail
          godot --headless --path runtime --script res://tests/audio/test_audio_manager.gd 2>&1 | tee "$RUNNER_TEMP/audio.log"
      - name: Sem erros no log do Godot
        run: |
          if grep -hE '(^|[^A-Z_])(ERROR|SCRIPT ERROR):' "$RUNNER_TEMP"/{import,audio}.log; then
            echo "::error title=Godot registrou erros::O Audio Manager e os testes devem rodar sem erros (M2-05)."
            exit 1
          fi
