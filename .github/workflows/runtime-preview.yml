# Servidor JSON-RPC do Preview e seus métodos no runtime (tarefas M4-04 e M4-05; Preview Protocol §1.1, §1.2, §2, §6, §7).
# Testa a sessão nos dois transportes (painel com dublê de window.vnPreview, janela com WebSocket em 127.0.0.1),
# valida cada mensagem contra preview-protocol.schema.json e roda a janela de ponta a ponta com
# --vn-preview-port/--vn-preview-token (4401, 4409, saída em 10 s quando a conexão cai).
name: Runtime preview

on:
  pull_request:
    paths: [runtime/vn_runtime/**, runtime/tests/preview/**, runtime/tests/fakes/**, runtime/project.godot, docs/specs/schemas/**, .github/workflows/runtime-preview.yml]
  push:
    branches: [main]
    paths: [runtime/vn_runtime/**, runtime/tests/preview/**, runtime/tests/fakes/**, runtime/project.godot, docs/specs/schemas/**, .github/workflows/runtime-preview.yml]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -q 'jsonschema>=4.18' 'websockets>=13'
      - name: Cache do Godot ${{ env.GODOT_VERSION }}
        id: cache-godot
        uses: actions/cache@v5
        with:
          path: ~/.cache/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64
      - name: Baixa o Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot.zip" "$url"
          mkdir -p ~/.cache/godot-bin
          unzip -q "$RUNNER_TEMP/godot.zip" -d ~/.cache/godot-bin
      - name: Instala o Godot
        run: |
          set -euo pipefail
          install -m 755 ~/.cache/godot-bin/"Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          godot --headless --version
      - name: Importa o projeto
        run: godot --headless --path runtime --import 2>&1 | tee "$RUNNER_TEMP/import.log"
      - name: Testes da sessão nos dois transportes
        run: |
          set -euo pipefail
          godot --headless --path runtime --script res://tests/preview/test_preview_server.gd \
            -- --transcript "$RUNNER_TEMP/preview.jsonl" 2>&1 | tee "$RUNNER_TEMP/preview.log"
      - name: Gera as fixtures dos métodos do Preview
        run: |
          python -m pip install -q 'jsonschema>=4.18'
          python runtime/tests/fixtures/generate.py
          godot --headless --path runtime --import 2>&1 | tee -a "$RUNNER_TEMP/import.log"
      - name: Testes dos métodos do Preview (M4-05)
        run: |
          set -euo pipefail
          godot --headless --path runtime --script res://tests/preview/test_preview_methods.gd 2>&1 | tee "$RUNNER_TEMP/methods.log"
      - name: Mensagens contra o schema e janela de ponta a ponta
        run: python runtime/tests/preview/check_protocol.py --transcript "$RUNNER_TEMP/preview.jsonl" --godot godot
      - name: Sem erros no log do Godot
        run: |
          # O Godot sai com 0 mesmo quando um script não compila; qualquer ERROR nos logs falha a CI.
          if grep -hE '(^|[^A-Z_])(ERROR|SCRIPT ERROR):' "$RUNNER_TEMP"/{import,preview,methods}.log | grep -vE 'resources still in use|ObjectDB'; then
            echo "::error title=Godot registrou erros::O servidor do Preview e os testes devem rodar sem erros (M4-04)."
            exit 1
          fi
