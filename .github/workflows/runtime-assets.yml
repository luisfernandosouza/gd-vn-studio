# VNAssets do runtime (tarefa M4-07; PP §1.3, RT §2, §11).
# Lê os bundles de teste (M0-08) como no jogo (recursos importados pelo Godot) e como no Preview
# (bytes do arquivo do autor) e confere que dão o mesmo resultado, a troca de um PNG em uso, o modo
# stream, o cache LRU e a leitura assíncrona do painel (com um dublê do fetch da página).
name: Runtime assets

on:
  pull_request:
    paths:
      - runtime/vn_runtime/assets/**
      - runtime/vn_runtime/core/**
      - runtime/tests/assets/**
      - runtime/tests/fixtures/**
      - runtime/project.godot
      - docs/specs/tools/compile_bundle.py
      - docs/specs/tools/sync_generated_copies.py
      - docs/specs/tools/generated_sources.json
      - .github/workflows/runtime-assets.yml
  push:
    branches: [main]
    paths:
      - runtime/vn_runtime/assets/**
      - runtime/vn_runtime/core/**
      - runtime/tests/assets/**
      - runtime/tests/fixtures/**
      - runtime/project.godot
      - docs/specs/tools/compile_bundle.py
      - docs/specs/tools/sync_generated_copies.py
      - docs/specs/tools/generated_sources.json
      - .github/workflows/runtime-assets.yml
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  assets:
    runs-on: [self-hosted, linux, vn-ci]
    timeout-minutes: 15
    env:
      VNSTUDIO_GENERATED_CACHE: ${{ github.workspace }}/../vnstudio-generated-cache
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Dependências Python (jsonschema das fixtures, fontTools fixado)
        run: |
          python -m pip install -q "jsonschema>=4.18" \
            "fonttools==$(python -c 'import json;print(json.load(open("docs/specs/tools/generated_sources.json"))["fonttools"])')"
      - uses: actions/cache@v4
        with:
          path: ${{ env.VNSTUDIO_GENERATED_CACHE }}
          key: generated-sources-${{ hashFiles('docs/specs/tools/generated_sources.json') }}
      - name: Presets e fontes do runtime (cópias geradas, M0-03)
        run: python docs/specs/tools/sync_generated_copies.py runtime
      - name: Bundles de teste (M0-08)
        run: python runtime/tests/fixtures/generate.py
      - name: Cache do Godot ${{ env.GODOT_VERSION }}
        id: cache-godot
        uses: actions/cache@v5
        with:
          path: ~/.cache/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64
      - name: Baixa o Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot.zip" "$url"
          mkdir -p ~/.cache/godot-bin
          unzip -q "$RUNNER_TEMP/godot.zip" -d ~/.cache/godot-bin
      - name: Instala o Godot
        run: |
          set -euo pipefail
          install -m 755 ~/.cache/godot-bin/"Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          godot --headless --version
      - name: Importa o projeto
        run: godot --headless --path runtime --import 2>&1 | tee "$RUNNER_TEMP/import.log"
      - name: Testes do VNAssets
        run: |
          set -euo pipefail
          godot --headless --path runtime --script res://tests/assets/test_vn_assets.gd 2>&1 | tee "$RUNNER_TEMP/assets.log"
      - name: Sem erros no log do Godot
        run: |
          # O Godot sai com 0 mesmo quando um script não compila; qualquer ERROR nos logs falha a CI.
          if grep -hE '(^|[^A-Z_])(ERROR|SCRIPT ERROR):' "$RUNNER_TEMP"/{import,assets}.log; then
            echo "::error title=Godot registrou erros::O VNAssets e os testes devem rodar sem erros (M4-07)."
            exit 1
          fi
