# Bancada do spike do Preview Web (spikes/preview-web) no macOS.
# Exporta o spike no Linux e mede no macOS (Apple Silicon, GPU virtual do runner):
# WKWebView (motor do Tauri no macOS), WebKit e Chromium do Playwright.
name: Spike Preview Web (macOS)

on:
  workflow_dispatch:
  push:
    branches: [claude/preview-web-spike]
    paths: [spikes/preview-web/**, .github/workflows/preview-web-spike.yml]

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Godot 4.7.2 e template Web
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          curl -sSL -o tpl.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          D=~/.local/share/godot/export_templates/4.7.2.stable; mkdir -p $D
          unzip -joq tpl.tpz templates/web_nothreads_release.zip templates/version.txt -d $D
          rm tpl.tpz
      - name: Exportar e gerar bundles
        working-directory: spikes/preview-web
        run: |
          GODOT=$GITHUB_WORKSPACE/Godot_v4.7.2-stable_linux.x86_64 tools/export.sh
          python -m pip install -q 'jsonschema>=4.18'
          python tools/make_bundles.py build/bundles
      - uses: actions/upload-artifact@v4
        with:
          name: preview-web-build
          path: |
            spikes/preview-web/build/web
            spikes/preview-web/build/bundles

  macos:
    needs: export
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: preview-web-build
          path: spikes/preview-web/build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright
        working-directory: spikes/preview-web
        run: |
          npm init -y >/dev/null && npm i -s playwright@1
          npx playwright install chromium webkit
      - name: system_profiler (GPU)
        run: system_profiler SPDisplaysDataType || true
      - name: WKWebView
        working-directory: spikes/preview-web
        run: |
          node tools/serve.mjs 8767 --cache &
          sleep 1
          swift tools/wkwebview_bench.swift 8767 20 | tee build/results-wkwebview.json
      - name: Chromium com GPU
        working-directory: spikes/preview-web
        run: node tools/bench.mjs --edits 20 --templates web --browser chromium --gpu --out build/results-macos-chromium-gpu.json
      - name: WebKit (Playwright)
        working-directory: spikes/preview-web
        run: node tools/bench.mjs --edits 20 --templates web --browser webkit --out build/results-macos-webkit.json
      - name: Resultados
        if: always()
        working-directory: spikes/preview-web
        run: for f in build/results-*.json; do echo "== $f"; cat "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-web-results-macos
          path: spikes/preview-web/build/results-*.json
