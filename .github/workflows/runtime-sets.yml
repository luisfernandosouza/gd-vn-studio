# Sets compostos e hotspots cosméticos do runtime (tarefa M2-08; UI Spec §5).
# Roda os testes do VNSetView e do encaixe dele no Stage real, com o set da demo
# de docs/specs/examples/demo-project/ (o encaixe na tela de título fica no runtime-ui-manager.yml).
name: Runtime sets

on:
  pull_request:
    paths: [runtime/vn_runtime/sets/**, runtime/vn_runtime/stage/**, runtime/vn_runtime/ui_manager/vn_ui_hotspot.gd, runtime/vn_runtime/ui_manager/vn_ui_text.gd, runtime/vn_runtime/core/**, runtime/tests/sets/**, runtime/tests/stage/**, runtime/tests/fakes/**, runtime/project.godot, docs/specs/examples/demo-project/**, .github/workflows/runtime-sets.yml]
  push:
    branches: [main]
    paths: [runtime/vn_runtime/sets/**, runtime/vn_runtime/stage/**, runtime/vn_runtime/ui_manager/vn_ui_hotspot.gd, runtime/vn_runtime/ui_manager/vn_ui_text.gd, runtime/vn_runtime/core/**, runtime/tests/sets/**, runtime/tests/stage/**, runtime/tests/fakes/**, runtime/project.godot, docs/specs/examples/demo-project/**, .github/workflows/runtime-sets.yml]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  sets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Cache do Godot ${{ env.GODOT_VERSION }}
        id: cache-godot
        uses: actions/cache@v5
        with:
          path: ~/.cache/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64
      - name: Baixa o Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot.zip" "$url"
          mkdir -p ~/.cache/godot-bin
          unzip -q "$RUNNER_TEMP/godot.zip" -d ~/.cache/godot-bin
      - name: Instala o Godot
        run: |
          set -euo pipefail
          install -m 755 ~/.cache/godot-bin/"Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          godot --headless --version
      - name: Importa o projeto
        run: godot --headless --path runtime --import 2>&1 | tee "$RUNNER_TEMP/import.log"
      - name: Testes dos sets e hotspots
        run: |
          set -euo pipefail
          godot --headless --path runtime --script res://tests/sets/test_sets.gd 2>&1 | tee "$RUNNER_TEMP/sets.log"
      - name: Sem erros no log do Godot
        run: |
          # O Godot sai com 0 mesmo quando um script não compila; qualquer ERROR nos logs falha a CI.
          if grep -hE '(^|[^A-Z_])(ERROR|SCRIPT ERROR):' "$RUNNER_TEMP"/{import,sets}.log; then
            echo "::error title=Godot registrou erros::Os sets e os testes devem rodar sem erros (M2-08)."
            exit 1
          fi
