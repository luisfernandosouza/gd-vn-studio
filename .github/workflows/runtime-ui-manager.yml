# UI Manager do runtime (tarefa M2-06; UI Spec §2–§4, §8, §12).
# Compila a demo das specs com o compilador de referência e roda os testes do
# UI Manager contra as telas title, settings, credits e extras, com os dublês
# dos outros módulos (tests/fakes/).
name: Runtime UI Manager

on:
  pull_request:
    paths: [runtime/vn_runtime/ui_manager/**, runtime/vn_runtime/sets/**, runtime/vn_runtime/core/**, runtime/tests/ui_manager/**, runtime/tests/fakes/**, docs/specs/examples/**, docs/specs/presets/**, docs/specs/tools/compile_bundle.py, .github/workflows/runtime-ui-manager.yml]
  push:
    branches: [main]
    paths: [runtime/vn_runtime/ui_manager/**, runtime/vn_runtime/sets/**, runtime/vn_runtime/core/**, runtime/tests/ui_manager/**, runtime/tests/fakes/**, docs/specs/examples/**, docs/specs/presets/**, docs/specs/tools/compile_bundle.py, .github/workflows/runtime-ui-manager.yml]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  ui-manager:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -q 'jsonschema>=4.18'
      - name: Compila o bundle da demo das specs
        run: python docs/specs/tools/compile_bundle.py docs/specs/examples/demo-project "$RUNNER_TEMP/demo" docs/specs/examples/fishing-plugin
      - name: Cache do Godot ${{ env.GODOT_VERSION }}
        id: cache-godot
        uses: actions/cache@v5
        with:
          path: ~/.cache/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64
      - name: Baixa o Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot.zip" "$url"
          mkdir -p ~/.cache/godot-bin
          unzip -q "$RUNNER_TEMP/godot.zip" -d ~/.cache/godot-bin
      - name: Instala o Godot
        run: |
          set -euo pipefail
          install -m 755 ~/.cache/godot-bin/"Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          godot --headless --version
      - name: Importa o projeto
        run: godot --headless --path runtime --import 2>&1 | tee "$RUNNER_TEMP/import.log"
      - name: Testes do UI Manager
        run: |
          set -euo pipefail
          godot --headless --path runtime --script res://tests/ui_manager/test_ui_manager.gd -- --bundle "$RUNNER_TEMP/demo" 2>&1 | tee "$RUNNER_TEMP/ui.log"
      - name: Sem erros no log do Godot
        run: |
          # O Godot sai com 0 mesmo quando um script não compila; qualquer ERROR nos logs falha a CI.
          if grep -hE '(^|[^A-Z_])(ERROR|SCRIPT ERROR):' "$RUNNER_TEMP"/{import,ui}.log; then
            echo "::error title=Godot registrou erros::O UI Manager e os testes devem rodar sem erros (M2-06)."
            exit 1
          fi
