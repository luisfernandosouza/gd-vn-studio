# Boot do runtime (tarefa M2-01; RT §2, §2.1, §3.0; BS §5.1, §5.2, §8.2, §13.1).
# Gera os bundles das fixtures (M0-08), importa o projeto e roda os testes do boot com os dublês (M0-07):
# JCS contra conformance/canonical.json, leitura da forma JSON e .vnb, content_hash, G001/G002,
# idioma, perfil recusado (G006), pergunta da primeira abertura e chegada ao título.
name: Runtime boot

on:
  pull_request:
    paths: [runtime/vn_runtime/**, runtime/tests/**, runtime/project.godot, docs/specs/tools/**, docs/specs/schemas/**, docs/specs/presets/**, docs/specs/conformance/canonical.json, .github/workflows/runtime-boot.yml]
  push:
    branches: [main]
    paths: [runtime/vn_runtime/**, runtime/tests/**, runtime/project.godot, docs/specs/tools/**, docs/specs/schemas/**, docs/specs/presets/**, docs/specs/conformance/canonical.json, .github/workflows/runtime-boot.yml]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  boot:
    runs-on: [self-hosted, linux, vn-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -q 'jsonschema>=4.18'
      - name: Gera os bundles das fixtures
        run: python runtime/tests/fixtures/generate.py
      - name: Cache do Godot ${{ env.GODOT_VERSION }}
        id: cache-godot
        uses: actions/cache@v5
        with:
          path: ~/.cache/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64
      - name: Baixa o Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot.zip" "$url"
          mkdir -p ~/.cache/godot-bin
          unzip -q "$RUNNER_TEMP/godot.zip" -d ~/.cache/godot-bin
      - name: Instala o Godot
        run: |
          set -euo pipefail
          install -m 755 ~/.cache/godot-bin/"Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          godot --headless --version
      - name: Importa o projeto
        run: godot --headless --path runtime --import 2>&1 | tee "$RUNNER_TEMP/import.log"
      - name: Testes do boot
        run: |
          set -euo pipefail
          godot --headless --path runtime --script res://tests/boot/test_boot.gd 2>&1 | tee "$RUNNER_TEMP/boot.log"
      - name: Boot com dublês chega ao título a partir de uma fixture
        run: |
          set -euo pipefail
          godot --headless --path runtime --quit -- --vn-fakes --vn-bundle res://tests/fixtures/bundles/dialogue/ 2>&1 | tee "$RUNNER_TEMP/run.log"
          grep -q "vn-boot: título aberto" "$RUNNER_TEMP/run.log"
      - name: Sem erros no log do Godot
        run: |
          # O Godot sai com 0 mesmo quando um script não compila; qualquer ERROR nos logs falha a CI.
          if grep -hE '(^|[^A-Z_])(ERROR|SCRIPT ERROR):' "$RUNNER_TEMP"/{import,boot,run}.log; then
            echo "::error title=Godot registrou erros::O boot e os testes devem rodar sem erros (M2-01)."
            exit 1
          fi
