# Teste B dos assets do Preview (M4-01, D18, PP §1.3) no macOS (WKWebView) e no Windows (Edge,
# o motor do WebView2). O WebKitGTK e o Chromium do Linux rodam fora da CI (ver spikes/preview-assets/README.md).
# Pasta e workflow temporários: apagar junto com spikes/preview-assets/.
name: Spike Preview assets (teste B)

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-pbefev]
    paths: [spikes/preview-assets/**, .github/workflows/preview-assets-spike.yml]

concurrency:
  group: preview-assets-spike
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Godot 4.7.2 e template Web
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          curl -sSL -o tpl.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          D=~/.local/share/godot/export_templates/4.7.2.stable; mkdir -p $D
          unzip -joq tpl.tpz templates/web_nothreads_release.zip templates/version.txt -d $D
          rm tpl.tpz
      - name: Exportar e gerar os assets (200 imagens, 30 músicas)
        working-directory: spikes/preview-assets
        run: |
          GODOT=$GITHUB_WORKSPACE/Godot_v4.7.2-stable_linux.x86_64 tools/export.sh
          command -v ffmpeg || (sudo apt-get update -q >/dev/null && sudo apt-get install -y -q --no-install-recommends ffmpeg >/dev/null)
          python -m pip install -q numpy pillow
          python tools/make_assets.py build/assets
      - uses: actions/upload-artifact@v5
        with:
          name: preview-assets-build
          compression-level: 0
          path: |
            spikes/preview-assets/build/web
            spikes/preview-assets/build/assets

  macos:
    needs: export
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: preview-assets-build
          path: spikes/preview-assets/build
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: WKWebView
        timeout-minutes: 45
        working-directory: spikes/preview-assets
        run: |
          sysctl -n machdep.cpu.brand_string hw.memsize
          node tools/serve.mjs 8767 --cache --rss 'WebKit' &
          SERVER=$!
          sleep 1
          swift tools/wkwebview_bench.swift 8767 20 '' > build/results-assets-wkwebview.json
          kill $SERVER
      - name: Resultados
        if: always()
        working-directory: spikes/preview-assets
        run: |
          python3 tools/summary_assets.py build/results-assets-*.json || true
          cat build/results-assets-*.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: preview-assets-results-macos
          path: spikes/preview-assets/build/results-assets-*.json

  # Só à mão: o runner Windows (2 vCPUs, sem GPU) não dá tempos estáveis (59 ms a 53 s por imagem).
  windows:
    needs: export
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: preview-assets-build
          path: spikes/preview-assets/build
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Edge (motor do WebView2)
        timeout-minutes: 45
        working-directory: spikes/preview-assets
        shell: bash
        run: |
          npm init -y >/dev/null && npm i -s playwright@1
          # Com janela (--gpu): o ANGLE usa o D3D11 (WARP no runner, sem GPU); headless com SwiftShader
          # levou ~10 s por imagem nos 2 vCPUs do runner.
          node tools/assets_bench.mjs --browser chromium --channel msedge --gpu --out build/results-assets-msedge.json
      - name: Resultados
        if: always()
        working-directory: spikes/preview-assets
        shell: bash
        run: |
          python tools/summary_assets.py build/results-assets-*.json || true
          cat build/results-assets-*.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: preview-assets-results-windows
          path: spikes/preview-assets/build/results-assets-*.json
