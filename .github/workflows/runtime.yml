# CI do runtime (tarefa M0-04): Godot 4.7.2 headless, com cache do binário (Build System §2.1).
# 1. O projeto runtime/ importa e abre sem erros (tarefa M0-02).
# 2. O executor headless roda os vetores de conformidade: godot --headless -- --vn-test (RT §12, spec 08 §4).
#    Cada caso cujo módulo ainda não tem implementação real em runtime/vn_runtime/ sai como pulado (M1-01);
#    o autoteste do executor (tests/conformance/test_runner.gd) confere a leitura, a comparação e a saída.
# 3. A referência Python (tools/conformance.py) roda junto: spec 08 §4 pede o runner nativo e a referência
#    em toda mudança no runtime ou nos casos.
# 4. O job `web` (tarefa M4-03) exporta o runtime para Web sem threads (preset "Web (vetores)", BS §7.3), roda o mesmo
#    executor num Chromium headless do Playwright e exige o mesmo `N/M` e os mesmos pulados do runner nativo.
name: Runtime

on:
  pull_request:
    paths: [runtime/**, docs/specs/conformance/**, docs/specs/tools/sync_generated_copies.py, .github/workflows/runtime.yml]
  push:
    branches: [main]
    paths: [runtime/**, docs/specs/conformance/**, docs/specs/tools/sync_generated_copies.py, .github/workflows/runtime.yml]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  godot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Cache do Godot ${{ env.GODOT_VERSION }}
        id: cache-godot
        uses: actions/cache@v5
        with:
          path: ~/.cache/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64
      - name: Baixa o Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot.zip" "$url"
          mkdir -p ~/.cache/godot-bin
          unzip -q "$RUNNER_TEMP/godot.zip" -d ~/.cache/godot-bin
      - name: Instala o Godot
        run: |
          set -euo pipefail
          install -m 755 ~/.cache/godot-bin/"Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          godot --headless --version
      - name: Importa o projeto
        run: godot --headless --path runtime --import 2>&1 | tee "$RUNNER_TEMP/import.log"
      - name: Abre e fecha o projeto
        run: |
          set -euo pipefail
          godot --headless --path runtime --quit 2>&1 | tee "$RUNNER_TEMP/run.log"
      - name: Vetores de conformidade (--vn-test)
        run: |
          set -euo pipefail
          # O código de saída do executor vale: 0 sem falhas, 1 com falha, 2 com erro de uso.
          godot --headless --path runtime -- --vn-test docs/specs/conformance 2>&1 | tee "$RUNNER_TEMP/vn-test.log"
      - name: Autoteste do executor (--vn-test)
        run: |
          set -euo pipefail
          godot --headless --path runtime --script res://tests/conformance/test_runner.gd 2>&1 | tee "$RUNNER_TEMP/vn-test-selftest.log"
      - name: Sem erros no log do Godot
        run: |
          # O Godot sai com 0 mesmo quando registra erros de script; qualquer ERROR nos logs falha a CI.
          if grep -hE '(^|[^A-Z_])(ERROR|SCRIPT ERROR):' "$RUNNER_TEMP"/{import,run,vn-test,vn-test-selftest}.log; then
            echo "::error title=Godot registrou erros::O runtime deve importar, abrir e rodar --vn-test sem erros (M0-02, M0-04)."
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Referência Python dos vetores (tools/conformance.py)
        working-directory: docs/specs
        run: python tools/conformance.py

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Cache do Godot ${{ env.GODOT_VERSION }} e dos templates Web
        id: cache-godot
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-web-${{ env.GODOT_VERSION }}-linux-x86_64
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Baixa o Godot ${{ env.GODOT_VERSION }} e os templates Web sem threads
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot.zip" "$url"
          mkdir -p ~/.cache/godot-bin
          unzip -q "$RUNNER_TEMP/godot.zip" -d ~/.cache/godot-bin
          # O pacote de templates tem ~1,3 GB; o script baixa só os dois templates Web (Range HTTP).
          python3 runtime/tests/web/fetch_web_templates.py "$GODOT_VERSION"
      - name: Instala o Godot
        run: |
          set -euo pipefail
          install -m 755 ~/.cache/godot-bin/"Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          godot --headless --version
      - name: fontTools na versão fixada
        run: python -m pip install -q "fonttools==$(python -c 'import json;print(json.load(open("docs/specs/tools/generated_sources.json"))["fonttools"])')"
      - name: Cópias geradas (presets e licenças entram no export)
        run: python docs/specs/tools/sync_generated_copies.py runtime
      - name: Importa e exporta o runtime para Web (sem threads)
        run: |
          set -euo pipefail
          godot --headless --path runtime --import 2>&1 | tee "$RUNNER_TEMP/web-import.log"
          mkdir -p build/runtime-web-vectors
          godot --headless --path runtime --export-debug "Web (vetores)" ../build/runtime-web-vectors/index.html 2>&1 | tee "$RUNNER_TEMP/web-export.log"
          test -s build/runtime-web-vectors/index.wasm
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Playwright e Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null && npm i -s playwright@1
          npx playwright install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Vetores no runtime nativo
        run: godot --headless --path runtime -- --vn-test docs/specs/conformance 2>&1 | tee "$RUNNER_TEMP/native.log"
      - name: Vetores no runtime Web (Chromium)
        run: node runtime/tests/web/run_web_vectors.cjs build/runtime-web-vectors docs/specs/conformance 2>&1 | tee "$RUNNER_TEMP/web.log"
      - name: Mesmo N/M do nativo
        run: |
          set -euo pipefail
          # Resumo e pulados são iguais nos dois (spec 08 §4); o cabeçalho e o navegador diferem.
          pick() { grep -E '^(FALHOU|  esperado|  obtido|  erro|[0-9]+/[0-9]+ \(|  pulados)' "$1"; }
          pick "$RUNNER_TEMP/native.log" > "$RUNNER_TEMP/native.sum"
          pick "$RUNNER_TEMP/web.log" > "$RUNNER_TEMP/web.sum"
          grep -E '^[0-9]+/[0-9]+ \(' "$RUNNER_TEMP/web.sum" || { echo "::error::o runner Web não imprimiu o resumo N/M"; exit 1; }
          if ! diff -u "$RUNNER_TEMP/native.sum" "$RUNNER_TEMP/web.sum"; then
            echo "::error title=Web difere do nativo::O runner Web deve dar o mesmo N/M e os mesmos casos pulados do nativo (spec 08 §4, M4-03)."
            exit 1
          fi
      - name: Sem erros no log do Godot
        run: |
          if grep -hE '(^|[^A-Z_])(ERROR|SCRIPT ERROR):' "$RUNNER_TEMP"/{web-import,web-export,native,web}.log; then
            echo "::error title=Godot registrou erros::O export Web e o runner Web devem rodar sem erros."
            exit 1
          fi
